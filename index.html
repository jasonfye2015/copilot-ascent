<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copilot Ascent</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --panel: #111d2d;
      --panel2: #1b2b3f;
      --line: #7dd3fc;
      --accent: #67e8f9;
      --accent2: #22c55e;
      --danger: #ef4444;
      --gold: #fbbf24;
      --text: #dfefff;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: radial-gradient(circle at top, #101c2a, var(--bg) 55%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #game-shell {
      position: relative;
      width: min(92vw, 1200px);
      height: min(92vh, 760px);
      background: linear-gradient(180deg, rgba(17,29,45,0.98), rgba(9,16,26,0.98));
      border: 3px solid var(--line);
      box-shadow: 0 0 0 4px rgba(125,211,252,0.15), 0 18px 40px var(--shadow);
      border-radius: 12px;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #0b1120;
    }

    .hud {
      position: absolute;
      left: 16px;
      top: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .panel {
      background: rgba(16,22,33,0.72);
      border: 1px solid rgba(125,211,252,0.6);
      border-radius: 8px;
      padding: 8px 12px;
      box-shadow: 0 0 10px rgba(34,197,94,0.16);
      backdrop-filter: blur(2px);
      min-width: 180px;
    }

    .title {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
      opacity: 0.85;
    }

    .value {
      font-weight: 700;
      font-size: 18px;
      color: var(--text);
    }

    .small {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      pointer-events: none;
      opacity: 0.5;
    }

    .crosshair::before,
    .crosshair::after {
      content: "";
      position: absolute;
      background: rgba(125,211,252,0.7);
    }

    .crosshair::before {
      left: 7px;
      top: 0;
      width: 2px;
      height: 16px;
    }

    .crosshair::after {
      left: 0;
      top: 7px;
      width: 16px;
      height: 2px;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      background: rgba(11,17,32,0.88);
      border: 1px solid rgba(125,211,252,0.7);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      box-shadow: 0 0 18px rgba(125,211,252,0.14);
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="game-shell">
    <canvas id="gameCanvas" width="1200" height="760"></canvas>

    <div class="hud">
      <div class="panel">
        <div class="title">Floor</div>
        <div id="floorValue" class="value">1</div>
      </div>

      <div class="panel">
        <div class="title">Family Line</div>
        <div id="familyValue" class="value">I</div>
      </div>

      <div class="panel">
        <div class="title">Health</div>
        <div id="healthValue" class="value">100 / 100</div>
      </div>

      <div class="panel">
        <div class="title">Weapon</div>
        <div id="weaponValue" class="value">Abyss Knife</div>
      </div>
    </div>

    <div class="crosshair"></div>
    <div id="toast" class="toast">Town Access</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const toastEl = document.getElementById('toast');

    const ui = {
      floorValue: document.getElementById('floorValue'),
      familyValue: document.getElementById('familyValue'),
      healthValue: document.getElementById('healthValue'),
      weaponValue: document.getElementById('weaponValue')
    };

    const GAME_WIDTH = canvas.width;
    const GAME_HEIGHT = canvas.height;
    const TILE = 64;

    const state = {
      mode: 'title',
      floor: 1,
      maxFloor: 50,
      familyGeneration: 1,
      time: 0,
      keys: { w:false, a:false, s:false, d:false, space:false, e:false, q:false, enter:false, '1':false, '2':false, '3':false },
      lastTime: 0,
      mapSize: 5,
      rooms: [],
      currentRoom: null,
      player: null,
      enemies: [],
      projectiles: [],
      loot: [],
      floorCleared: false,
      town: { gold: 0, relics: 0, upgrades: { vitality:0, strength:0, resolve:0 } },
      familyLegacy: { vitality:0, strength:0, resolve:0, bossKills:0 },
      selectedWeapon: 'Abyss Knife',
      minimap: []
    };

    function loadLegacy() {
      try {
        const raw = localStorage.getItem('copilot-ascent-legacy');
        if (!raw) return;
        const data = JSON.parse(raw);
        state.familyLegacy = { ...state.familyLegacy, ...data };
      } catch (err) {
        console.warn('Legacy load failed', err);
      }
    }

    function saveLegacy() {
      localStorage.setItem('copilot-ascent-legacy', JSON.stringify(state.familyLegacy));
    }

    function showToast(text, duration = 1500) {
      toastEl.textContent = text;
      toastEl.classList.add('show');
      clearTimeout(showToast.timeoutId);
      showToast.timeoutId = setTimeout(() => toastEl.classList.remove('show'), duration);
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function randRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randInt(min, max) {
      return Math.floor(randRange(min, max + 1));
    }

    function rectsIntersect(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function createPlayer() {
      return {
        x: GAME_WIDTH * 0.5,
        y: GAME_HEIGHT * 0.6,
        w: 22,
        h: 22,
        speed: 220,
        maxHp: 100 + state.familyLegacy.vitality * 10,
        hp: 100 + state.familyLegacy.vitality * 10,
        damage: 18 + state.familyLegacy.strength * 2,
        attackCooldown: 0,
        facingX: 1,
        facingY: 0
      };
    }

    function createEnemy(type = 'crawler') {
      const enemy = {
        x: randRange(120, GAME_WIDTH - 150),
        y: randRange(120, GAME_HEIGHT - 150),
        w: 18,
        h: 18,
        type,
        hp: 26 + state.floor * 6,
        maxHp: 26 + state.floor * 6,
        speed: 45 + state.floor * 3,
        damage: 8 + state.floor,
        attackCooldown: 0
      };

      if (type === 'brute') {
        enemy.w = 26;
        enemy.h = 26;
        enemy.hp = 70 + state.floor * 12;
        enemy.maxHp = enemy.hp;
        enemy.speed = 30 + state.floor * 3;
        enemy.damage = 14 + state.floor * 2;
      }

      return enemy;
    }

    function createBoss() {
      return {
        x: GAME_WIDTH * 0.55,
        y: GAME_HEIGHT * 0.45,
        w: 48,
        h: 48,
        type: 'boss',
        hp: 220 + state.floor * 55,
        maxHp: 220 + state.floor * 55,
        speed: 70 + state.floor * 2,
        damage: 16 + state.floor * 2,
        attackCooldown: 0,
        phase: 0
      };
    }

    function roomTypeLabel(type) {
      const labels = {
        start: 'Entry',
        combat: 'Combat',
        treasure: 'Treasure',
        shrine: 'Shrine',
        rest: 'Sanctum',
        boss: 'Boss',
        empty: 'Hall'
      };
      return labels[type] || 'Hall';
    }

    function buildFloor(floorNumber) {
      const size = state.mapSize;
      const roomGrid = [];

      for (let y = 0; y < size; y++) {
        const row = [];
        for (let x = 0; x < size; x++) {
          row.push({
            x, y,
            type: 'empty',
            doors: { n: false, e: false, s: false, w: false },
            enemies: [],
            loot: [],
            visited: false,
            boss: false
          });
        }
        roomGrid.push(row);
      }

      const startRoom = roomGrid[Math.floor(size / 2)][Math.floor(size / 2)];
      startRoom.type = 'start';
      startRoom.visited = true;

      const available = [];
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (x !== Math.floor(size / 2) || y !== Math.floor(size / 2)) {
            available.push({ x, y });
          }
        }
      }

      let bossRoom = { x: 0, y: 0 };
      let farthest = -1;
      for (const pos of available) {
        const dx = pos.x - Math.floor(size / 2);
        const dy = pos.y - Math.floor(size / 2);
        const dist = Math.abs(dx) + Math.abs(dy);
        if (dist > farthest) {
          farthest = dist;
          bossRoom = pos;
        }
      }
      const bossTarget = roomGrid[bossRoom.y][bossRoom.x];
      bossTarget.type = 'boss';
      bossTarget.boss = true;

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const room = roomGrid[y][x];
          if (x > 0) room.doors.w = true; roomGrid[y][x - 1].doors.e = true;
          if (x < size - 1) room.doors.e = true;
          if (y > 0) room.doors.n = true; roomGrid[y - 1][x].doors.s = true;
          if (y < size - 1) room.doors.s = true;
        }
      }

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const room = roomGrid[y][x];
          if (room.type === 'start' || room.type === 'boss') continue;
          const roll = Math.random();
          if (roll < 0.42) room.type = 'combat';
          else if (roll < 0.62) room.type = 'treasure';
          else if (roll < 0.78) room.type = 'shrine';
          else if (roll < 0.9) room.type = 'rest';
          else room.type = 'empty';
        }
      }

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const room = roomGrid[y][x];
          if (room.type === 'start') {
            room.enemies = [];
            room.loot = [];
            continue;
          }
          if (room.type === 'combat') {
            const enemyCount = 2 + Math.floor(Math.random() * 3) + Math.min(3, floorNumber);
            for (let i = 0; i < enemyCount; i++) {
              room.enemies.push(createEnemy(Math.random() < 0.25 ? 'brute' : 'crawler'));
            }
          }
          if (room.type === 'treasure') {
            room.enemies.push(createEnemy(Math.random() < 0.4 ? 'brute' : 'crawler'));
            room.loot.push({ kind: 'gold', x: GAME_WIDTH * 0.7, y: GAME_HEIGHT * 0.5, w: 10, h: 10 });
            room.loot.push({ kind: 'relic', x: GAME_WIDTH * 0.3, y: GAME_HEIGHT * 0.5, w: 10, h: 10 });
          }
          if (room.type === 'rest') {
            room.loot.push({ kind: 'heal', x: GAME_WIDTH * 0.5, y: GAME_HEIGHT * 0.5, w: 12, h: 12 });
          }
          if (room.type === 'shrine') {
            room.enemies.push(createEnemy('crawler'));
            room.loot.push({ kind: 'blessing', x: GAME_WIDTH * 0.5, y: GAME_HEIGHT * 0.5, w: 12, h: 12 });
          }
          if (room.type === 'boss') {
            room.enemies.push(createBoss());
          }
        }
      }

      return roomGrid;
    }

    function getRoomAt(x, y) {
      if (!state.rooms.length) return null;
      return state.rooms[y]?.[x] || null;
    }

    function getNeighborRoom(room, dir) {
      const offsets = { n:[0,-1], e:[1,0], s:[0,1], w:[-1,0] };
      const [dx, dy] = offsets[dir];
      return getRoomAt(room.x + dx, room.y + dy);
    }

    function initFloor() {
      state.rooms = buildFloor(state.floor);
      const start = state.rooms[Math.floor(state.mapSize / 2)][Math.floor(state.mapSize / 2)];
      state.currentRoom = start;
      state.player = createPlayer();
      state.player.x = GAME_WIDTH * 0.52;
      state.player.y = GAME_HEIGHT * 0.62;
      state.projectiles = [];
      state.loot = [];
      state.floorCleared = false;
      state.enemies = [...state.currentRoom.enemies];
      ui.floorValue.textContent = state.floor;
      ui.familyValue.textContent = 'Gen ' + state.familyGeneration;
      ui.healthValue.textContent = `${Math.ceil(state.player.hp)} / ${state.player.maxHp}`;
      ui.weaponValue.textContent = state.selectedWeapon;
    }

    function tryTransition(direction) {
      const room = state.currentRoom;
      if (!room || !room.doors[direction]) return false;
      const next = getNeighborRoom(room, direction);
      if (!next) return false;

      state.currentRoom = next;
      state.enemies = [...next.enemies];
      state.loot = [...next.loot];

      const spawn = {
        n: { x: GAME_WIDTH * 0.5, y: GAME_HEIGHT - 70 },
        s: { x: GAME_WIDTH * 0.5, y: 70 },
        e: { x: 75, y: GAME_HEIGHT * 0.5 },
        w: { x: GAME_WIDTH - 90, y: GAME_HEIGHT * 0.5 }
      };

      const pos = spawn[direction];
      state.player.x = pos.x;
      state.player.y = pos.y;
      showToast(roomTypeLabel(next.type));
      return true;
    }

    function handleRoomTransitionInput() {
      const doorChecks = [
        ['n', state.keys.w],
        ['s', state.keys.s],
        ['e', state.keys.d],
        ['w', state.keys.a]
      ];

      for (const [dir, pressed] of doorChecks) {
        if (pressed && state.currentRoom.doors[dir]) {
          const px = state.player.x;
          const py = state.player.y;
          const nearDoor = (
            (dir === 'n' && py < 56 && px > GAME_WIDTH * 0.42 && px < GAME_WIDTH * 0.58) ||
            (dir === 's' && py > GAME_HEIGHT - 68 && px > GAME_WIDTH * 0.42 && px < GAME_WIDTH * 0.58) ||
            (dir === 'e' && px > GAME_WIDTH - 78 && py > GAME_HEIGHT * 0.42 && py < GAME_HEIGHT * 0.58) ||
            (dir === 'w' && px < 78 && py > GAME_HEIGHT * 0.42 && py < GAME_HEIGHT * 0.58)
          );
          if (nearDoor) {
            tryTransition(dir);
            return;
          }
        }
      }
    }

    function updatePlayer(dt) {
      const player = state.player;
      player.attackCooldown = Math.max(0, player.attackCooldown - dt);

      const dx = (state.keys.d ? 1 : 0) - (state.keys.a ? 1 : 0);
      const dy = (state.keys.s ? 1 : 0) - (state.keys.w ? 1 : 0);
      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy) || 1;
        const moveX = (dx / len) * player.speed * dt;
        const moveY = (dy / len) * player.speed * dt;
        player.x = clamp(player.x + moveX, 40, GAME_WIDTH - 45);
        player.y = clamp(player.y + moveY, 40, GAME_HEIGHT - 45);

        if (Math.abs(dx) > Math.abs(dy)) player.facingX = dx;
        else player.facingY = dy;
        if (dx !== 0) player.facingX = dx;
        if (dy !== 0) player.facingY = dy;
      }

      if (state.keys.space && player.attackCooldown <= 0) {
        player.attackCooldown = 0.3;

        const projSpeed = 520;
        const dxDir = player.facingX || 1;
        const dyDir = player.facingY || 0;
        state.projectiles.push({
          x: player.x,
          y: player.y,
          w: 10,
          h: 10,
          dx: dxDir * projSpeed,
          dy: dyDir * projSpeed,
          life: 0.45,
          owner: 'player',
          damage: player.damage
        });
      }

      handleRoomTransitionInput();

      for (const projectile of state.projectiles) {
        projectile.x += projectile.dx * dt;
        projectile.y += projectile.dy * dt;
        projectile.life -= dt;
      }
      state.projectiles = state.projectiles.filter(p => p.life > 0 && p.x > 0 && p.x < GAME_WIDTH && p.y > 0 && p.y < GAME_HEIGHT);

      for (const enemy of state.enemies) {
        enemy.attackCooldown = Math.max(0, enemy.attackCooldown - dt);
        const ex = enemy.x - player.x;
        const ey = enemy.y - player.y;
        const len = Math.hypot(ex, ey) || 1;
        if (len < 260) {
          enemy.x += (ex / len) * enemy.speed * dt;
          enemy.y += (ey / len) * enemy.speed * dt;
        }

        if (len < 26 && enemy.attackCooldown <= 0) {
          player.hp -= enemy.damage;
          enemy.attackCooldown = 0.9;
        }

        for (const projectile of state.projectiles) {
          if (projectile.owner === 'player') {
            if (rectsIntersect({ x: projectile.x, y: projectile.y, w: projectile.w, h: projectile.h }, { x: enemy.x, y: enemy.y, w: enemy.w, h: enemy.h })) {
              enemy.hp -= projectile.damage;
              projectile.life = 0;
            }
          }
        }
      }

      state.enemies = state.enemies.filter(enemy => {
        if (enemy.hp <= 0) {
          if (enemy.type === 'boss') {
            state.floorCleared = true;
            state.familyLegacy.bossKills += 1;
            saveLegacy();
            if (state.floor >= state.maxFloor) {
              state.mode = 'title';
              state.floor = 1;
              showToast('The curse is broken');
            } else {
              state.floor += 1;
              initFloor();
              showToast('Floor cleared');
            }
          } else {
            state.loot.push({ kind: 'gold', x: enemy.x, y: enemy.y, w: 12, h: 12 });
          }
          return false;
        }
        return true;
      });

      for (const item of state.loot) {
        if (rectsIntersect({ x: player.x, y: player.y, w: player.w, h: player.h }, { x: item.x, y: item.y, w: item.w, h: item.h })) {
          if (item.kind === 'gold') {
            state.town.gold += 10;
          }
          if (item.kind === 'relic') {
            state.familyLegacy.resolve += 1;
          }
          if (item.kind === 'heal') {
            player.hp = player.maxHp;
          }
          if (item.kind === 'blessing') {
            state.familyLegacy.vitality += 1;
          }
          item.collected = true;
        }
      }
      state.loot = state.loot.filter(item => !item.collected);

      if (player.hp <= 0) {
        state.familyGeneration += 1;
        state.familyLegacy.vitality += 1;
        state.familyLegacy.strength += 1;
        state.familyLegacy.resolve += 1;
        saveLegacy();
        state.mode = 'town';
        state.floor = Math.max(1, state.floor - 1);
        state.player = createPlayer();
        showToast('The next heir rises');
      }

      ui.healthValue.textContent = `${Math.ceil(player.hp)} / ${player.maxHp}`;
      ui.weaponValue.textContent = state.selectedWeapon;
      ui.familyValue.textContent = 'Gen ' + state.familyGeneration;
    }

    function drawDoor(x, y, w, h, active) {
      ctx.fillStyle = active ? '#67e8f9' : '#1e293b';
      ctx.fillRect(x, y, w, h);
    }

    function renderTitle() {
      ctx.fillStyle = '#08121d';
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      ctx.fillStyle = '#7dd3fc';
      ctx.font = 'bold 44px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('Copilot Ascent', GAME_WIDTH / 2, 200);

      ctx.font = '20px Segoe UI';
      ctx.fillStyle = '#dfefff';
      ctx.fillText('A rogue-like ascent through a cursed tower', GAME_WIDTH / 2, 250);
      ctx.fillText('Press ENTER to begin', GAME_WIDTH / 2, 340);
      ctx.fillText('WASD to move, SPACE to strike, E to pass through doors', GAME_WIDTH / 2, 380);
      ctx.fillText('Survive floor 50 and lift the family curse.', GAME_WIDTH / 2, 430);
      ctx.fillStyle = '#67e8f9';
      ctx.fillText('Legacy: ' + state.familyGeneration + ' generation', GAME_WIDTH / 2, 500);
    }

    function renderTown() {
      ctx.fillStyle = '#0d1826';
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      ctx.fillStyle = '#7dd3fc';
      ctx.font = 'bold 32px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('Town of the Last Heir', GAME_WIDTH / 2, 90);

      ctx.fillStyle = '#dfefff';
      ctx.font = '20px Segoe UI';
      ctx.fillText('E - Return to the Tower', GAME_WIDTH / 2, 150);
      ctx.fillText('Gold: ' + state.town.gold + '   Relics: ' + state.familyLegacy.resolve, GAME_WIDTH / 2, 190);

      ctx.fillStyle = '#67e8f9';
      ctx.fillRect(180, 230, 240, 150);
      ctx.fillStyle = '#dfefff';
      ctx.fillText('Vitality', 300, 270);
      ctx.fillText('Level ' + state.town.upgrades.vitality, 300, 305);
      ctx.fillText('Cost: 15 gold', 300, 340);
      ctx.fillText('Press 1', 300, 365);

      ctx.fillStyle = '#67e8f9';
      ctx.fillRect(500, 230, 240, 150);
      ctx.fillStyle = '#dfefff';
      ctx.fillText('Strength', 620, 270);
      ctx.fillText('Level ' + state.town.upgrades.strength, 620, 305);
      ctx.fillText('Cost: 15 gold', 620, 340);
      ctx.fillText('Press 2', 620, 365);

      ctx.fillStyle = '#67e8f9';
      ctx.fillRect(820, 230, 240, 150);
      ctx.fillStyle = '#dfefff';
      ctx.fillText('Resolve', 940, 270);
      ctx.fillText('Level ' + state.town.upgrades.resolve, 940, 305);
      ctx.fillText('Cost: 15 gold', 940, 340);
      ctx.fillText('Press 3', 940, 365);

      ctx.fillStyle = '#fbbf24';
      ctx.fillText('Family Blessing: ' + state.familyLegacy.bossKills + ' bosses defeated', GAME_WIDTH / 2, 610);
    }

    function drawRoom() {
      const room = state.currentRoom;
      if (!room) return;

      const bg = room.type === 'boss' ? '#120d18' : room.type === 'shrine' ? '#161629' : room.type === 'rest' ? '#112220' : '#0d1826';
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      ctx.fillStyle = 'rgba(125, 211, 252, 0.06)';
      for (let x = 0; x < GAME_WIDTH; x += 34) {
        for (let y = 0; y < GAME_HEIGHT; y += 34) {
          ctx.fillRect(x, y, 2, 2);
        }
      }

      ctx.strokeStyle = 'rgba(125, 211, 252, 0.8)';
      ctx.lineWidth = 3;
      ctx.strokeRect(24, 24, GAME_WIDTH - 48, GAME_HEIGHT - 48);

      const doorSize = 52;
      if (room.doors.n) drawDoor((GAME_WIDTH - doorSize) * 0.5, 10, doorSize, 18, true);
      if (room.doors.s) drawDoor((GAME_WIDTH - doorSize) * 0.5, GAME_HEIGHT - 28, doorSize, 18, true);
      if (room.doors.e) drawDoor(GAME_WIDTH - 28, (GAME_HEIGHT - doorSize) * 0.5, 18, doorSize, true);
      if (room.doors.w) drawDoor(10, (GAME_HEIGHT - doorSize) * 0.5, 18, doorSize, true);

      for (const item of state.loot) {
        const color = item.kind === 'gold' ? '#fbbf24' : item.kind === 'heal' ? '#22c55e' : '#a78bfa';
        ctx.fillStyle = color;
        ctx.fillRect(item.x, item.y, item.w, item.h);
      }

      for (const enemy of state.enemies) {
        ctx.fillStyle = enemy.type === 'boss' ? '#f59e0b' : '#ef4444';
        ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
      }

      for (const projectile of state.projectiles) {
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(projectile.x, projectile.y, projectile.w, projectile.h);
      }

      ctx.fillStyle = '#7dd3fc';
      ctx.fillRect(state.player.x, state.player.y, state.player.w, state.player.h);

      ctx.fillStyle = 'rgba(10, 16, 24, 0.8)';
      ctx.fillRect(18, 18, 210, 90);
      ctx.fillStyle = '#dfefff';
      ctx.font = '16px Segoe UI';
      ctx.fillText('Floor ' + state.floor, 30, 42);
      ctx.fillText(roomTypeLabel(room.type), 30, 68);
      ctx.fillText('HP: ' + Math.ceil(state.player.hp), 30, 94);

      ctx.fillStyle = 'rgba(10, 16, 24, 0.8)';
      ctx.fillRect(GAME_WIDTH - 220, 20, 190, 120);
      ctx.fillStyle = '#dfefff';
      ctx.font = '14px Segoe UI';
      ctx.fillText('Objective', GAME_WIDTH - 175, 42);
      if (room.type === 'boss') {
        ctx.fillText('Defeat the boss', GAME_WIDTH - 175, 62);
      } else {
        ctx.fillText('Clear the room', GAME_WIDTH - 175, 62);
      }
      ctx.fillText('Move: WASD', GAME_WIDTH - 175, 82);
      ctx.fillText('Attack: SPACE', GAME_WIDTH - 175, 102);
      ctx.fillText('Town: Q', GAME_WIDTH - 175, 122);
    }

    function render() {
      if (state.mode === 'title') renderTitle();
      else if (state.mode === 'town') renderTown();
      else drawRoom();
    }

    function updateTown(dt) {
      if (state.keys['1']) {
        if (state.town.gold >= 15) {
          state.town.gold -= 15;
          state.town.upgrades.vitality += 1;
          state.familyLegacy.vitality += 1;
          saveLegacy();
          showToast('Vitality Up');
        }
      }
      if (state.keys['2']) {
        if (state.town.gold >= 15) {
          state.town.gold -= 15;
          state.town.upgrades.strength += 1;
          state.familyLegacy.strength += 1;
          saveLegacy();
          showToast('Strength Up');
        }
      }
      if (state.keys['3']) {
        if (state.town.gold >= 15) {
          state.town.gold -= 15;
          state.town.upgrades.resolve += 1;
          state.familyLegacy.resolve += 1;
          saveLegacy();
          showToast('Resolve Up');
        }
      }
      if (state.keys.e) {
        state.mode = 'run';
        initFloor();
        showToast('Tower access');
      }
    }

    function update(dt) {
      state.time += dt;

      if (state.mode === 'title' && state.keys.enter) {
        state.mode = 'run';
        state.floor = 1;
        initFloor();
        showToast('The ascent begins');
      }

      if (state.mode === 'town') {
        updateTown(dt);
      }

      if (state.mode === 'run') {
        updatePlayer(dt);
      }

      if (state.keys.q && state.mode === 'run') {
        state.mode = 'town';
        showToast('Back to town');
      }
    }

    function bindKeys() {
      const keyMap = {
        w: 'w', a: 'a', s: 's', d: 'd',
        ArrowUp: 'w', ArrowLeft: 'a', ArrowDown: 's', ArrowRight: 'd',
        ' ': 'space', e: 'e', q: 'q', Enter: 'enter',
        '1': '1', '2': '2', '3': '3'
      };

      window.addEventListener('keydown', (event) => {
        const key = keyMap[event.key] || event.key.toLowerCase();
        if (key in state.keys) {
          state.keys[key] = true;
        }
      });

      window.addEventListener('keyup', (event) => {
        const key = keyMap[event.key] || event.key.toLowerCase();
        if (key in state.keys) {
          state.keys[key] = false;
        }
      });
    }

    function loop(timestamp) {
      const dt = Math.min(0.032, (timestamp - state.lastTime) / 1000 || 0.016);
      state.lastTime = timestamp;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    loadLegacy();
    bindKeys();
    initFloor();
    state.mode = 'title';
    requestAnimationFrame(loop);
  </script>
</body>
</html>
